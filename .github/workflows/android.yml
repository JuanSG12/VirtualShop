# Integración continua: en cada push compila la app, corre las pruebas y publica el APK como artefacto descargable.
name: Android CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Compilar y probar
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Tramas-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
